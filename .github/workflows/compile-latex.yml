name: Compile LaTeX applications

on:
  push:
    branches:
      - main
    paths:
      - 'applications/**/*.tex'
      - '.github/workflows/compile-latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra

      - name: Compile application PDFs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          job_dirs=(applications/Job_*)
          if (( ${#job_dirs[@]} == 0 )); then
            echo "No applications/Job_* directories found."
            exit 0
          fi

          for job_dir in "${job_dirs[@]}"; do
            [[ -d "$job_dir" ]] || continue

            for source in resume.tex cover_letter.tex; do
              if [[ -f "$job_dir/$source" ]]; then
                echo "Compiling $job_dir/$source"
                (
                  cd "$job_dir"
                  latexmk -pdf -interaction=nonstopmode -halt-on-error "$source"
                )
              else
                echo "Skipping missing $job_dir/$source"
              fi
            done

            find "$job_dir" -maxdepth 1 -type f \( \
              -name '*.aux' -o \
              -name '*.log' -o \
              -name '*.out' -o \
              -name '*.fls' -o \
              -name '*.fdb_latexmk' -o \
              -name '*.synctex.gz' \
            \) -delete
          done

      - name: Commit generated PDFs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          pdfs=(applications/Job_*/*.pdf)
          if (( ${#pdfs[@]} == 0 )); then
            echo "No generated PDFs found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -- "${pdfs[@]}"

          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi

          git commit -m "Compile application PDFs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
